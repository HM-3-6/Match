<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Match</title>
  <desc id="desc">Match — 组件化前端工程，文档先行，资源归一。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="130" cy="-20" r="340" fill="url(#glowA)"/>
    <circle cx="1070" cy="320" r="340" fill="url(#glowB)"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <text x="600" y="92" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#7dd3fc">FRONTEND ENGINEERING · DOCS FIRST</text>
  <text x="600" y="190" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="94" font-weight="700" letter-spacing="3" fill="#f8fafc">Match</text>
  <text x="600" y="234" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif" font-size="20" fill="#9aa8bd">组件化 · 文档先行 · 资源归一</text>
  <rect x="510" y="258" width="180" height="4" rx="2" fill="url(#accent)"/>
</svg>
