<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/index.css">
        <title>Document</title>
    </head>

    <body>
        <!-- Hero -->
        <section class="hero">
            <div class="logo">VI</div>
            <p class="subtitle">Grand Theft Auto</p>
            <div class="scroll-hint">Scroll ↓</div>
        </section>

        <!-- 滚动渐变揭示 -->
        <section class="reveal-section">
            <div class="deco-line"></div>
            <h2 class="reveal-text" id="revealText">
                Vice City never sleeps
            </h2>
        </section>

        <!-- 字母拆分弹出 -->
        <section class="split-section" id="splitSection">
            <div class="deco-line"></div>
            <h2 class="split-title" id="splitTitle">LEONIDA</h2>
            <p class="desc">
                仿照 GTA 官网的文字动画风格。<br>
                第一种是滚动驱动的渐变文字揭示，第二种是字母逐个弹出。
            </p>
        </section>

        <script src="/src/static/Javascript/textScrolling.js" defer></script>
    </body>

</html>
