        <script>
            const boxes = document.querySelectorAll('.slider-box');

            boxes.forEach((box) => {
                const slider = box.querySelector('.slider-input');

                // 初始化一次，保证初始分割位置正确
                box.style.setProperty('--percent', slider.value + '%');

                // 监听拖动
                slider.addEventListener('input', (e) => {
                    box.style.setProperty('--percent', e.target.value + '%');
                });
            });
        </script>
        <script>
            /* 精选路线「查看详情」轻提示 */
            function showToast(message) {
                let toast = document.getElementById('routeToast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'routeToast';
                    toast.className = 'toast';
                    document.body.appendChild(toast);
                }
                toast.textContent = message;
                void toast.offsetWidth;
                toast.classList.add('show');
                clearTimeout(showToast.timer);
                showToast.timer = setTimeout(function () {
                    toast.classList.remove('show');
                }, 1800);
            }
        </script>
        <!-- 精选旅游路线-->
