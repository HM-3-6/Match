<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Document</title>
        <link rel="stylesheet" href="../src/static/css/mapDemo.css">
    </head>

    <body>
        <div id="container"></div>

        <div id="cursorPanel" class="panel">
            <h3>鼠标样式</h3>
            <label><input type="radio" name="cursor" value="default"><span
                    class="ico">&#8598;</span><span>默认</span></label>
            <label><input type="radio" name="cursor" value="pointer" checked><span
                    class="ico">&#9757;</span><span>手型</span></label>
            <label><input type="radio" name="cursor" value="move"><span
                    class="ico">&#10021;</span><span>移动</span></label>
            <label><input type="radio" name="cursor" value="crosshair"><span
                    class="ico">&#10043;</span><span>十字</span></label>
        </div>

        <div id="infoPanel" class="panel">
            <h4>地图级别与中心点</h4>
            <p>当前级别：<span id="map-zoom">17</span></p>
            <p>当前中心点：<span id="map-center">—</span></p>
        </div>

        <div id="boundsPanel" class="panel">
            <h4>地图显示范围</h4>
            <p>NorthEast：<span id="bounds-ne">—</span></p>
            <p>SouthWest：<span id="bounds-sw">—</span></p>
            <div class="btn-row">
                <button type="button" id="lockBoundsBtn" class="btn">限定显示范围</button>
                <button type="button" id="unlockBoundsBtn" class="btn btn-ghost">取消限制</button>
            </div>
        </div>

        <div id="dragPanel" class="panel">
            <h4>标记点拖拽</h4>
            <p id="dragStatus">请拖拽标记点试试</p>
            <div class="btn-row">
                <button type="button" id="bindBtn" class="btn">绑定事件</button>
                <button type="button" id="unbindBtn" class="btn btn-ghost">解绑事件</button>
            </div>
        </div>

        <div id="routePanel" class="panel">
            <h4>长征路线</h4>
            <p id="routeStatus">简化示意路线，非精确行军轨迹</p>
            <div class="btn-row">
                <button type="button" id="showRouteBtn" class="btn">显示路线</button>
                <button type="button" id="hideRouteBtn" class="btn btn-ghost">隐藏路线</button>
            </div>
        </div>

        <div id="controlPanel" class="panel">
            <h4>地图控件</h4>
            <div class="ctrl-grid">
                <label><input type="checkbox" checked data-control="scale"><span>比例尺</span></label>
                <label><input type="checkbox" checked data-control="toolbar"><span>工具条</span></label>
                <label><input type="checkbox" checked data-control="controlbar"><span>方向盘</span></label>
                <label><input type="checkbox" checked data-control="hawkeye"><span>显示鹰眼</span></label>
            </div>
        </div>

        <script src="./components/Javascript/maps.js"></script>
        <script src="./components/Javascript/mapComponent.js" defer></script>
    </body>

</html>
